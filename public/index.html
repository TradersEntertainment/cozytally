<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#191531">
  <title>CozyTally 🌙</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking the parser: a pending stylesheet also blocks
       script execution, so a slow or unreachable font host would otherwise
       leave the whole app stuck on a blank page. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
  </noscript>
  <link rel="stylesheet" href="/style.css?v=dev">
</head>
<body>

  <!-- night sky -->
  <div id="sky" aria-hidden="true">
    <div class="moon"></div>
    <!-- Mochi, the cat asleep on the moon -->
    <svg class="moon-cat" viewBox="0 0 130 84">
      <path d="M22,60 Q6,56 10,44 Q13,35 23,39" fill="none" stroke="#b7a4ff" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="60" cy="54" rx="40" ry="21" fill="#cfc0f2"/>
      <path d="M38,37 q4,8 0,14" stroke="#b7a4ff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M52,34 q4,9 0,16" stroke="#b7a4ff" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="95" cy="44" r="20" fill="#cfc0f2"/>
      <path d="M82,31 L79,16 L93,24 Z" fill="#cfc0f2"/>
      <path d="M84,28 L82.5,21 L89,25 Z" fill="#ffb6c9"/>
      <path d="M103,29 L108,15 L115,27 Z" fill="#cfc0f2"/>
      <path d="M105,26 L108,19 L111,25 Z" fill="#ffb6c9"/>
      <path d="M86,45 q3,3.5 6,0" stroke="#5e5480" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M100,45 q3,3.5 6,0" stroke="#5e5480" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M94,51 q2,2 4,0" stroke="#5e5480" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="84" cy="52" rx="3.5" ry="2" fill="#ff9eb5" opacity="0.6"/>
      <ellipse cx="107" cy="52" rx="3.5" ry="2" fill="#ff9eb5" opacity="0.6"/>
      <text class="zz zz1" x="112" y="26">z</text>
      <text class="zz zz2" x="119" y="16">z</text>
      <text class="zz zz3" x="125" y="8">z</text>
    </svg>
    <div class="shooting-star ss1"></div>
    <div class="shooting-star ss2"></div>
    <svg id="string-lights" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,20 Q300,80 600,35 T1200,25" fill="none" stroke="rgba(255,215,160,0.25)" stroke-width="2"/>
    </svg>
  </div>

  <!-- ===================== landing ===================== -->
  <main id="view-landing" class="view" hidden>
    <div class="landing-wrap">
      <div class="account-bar">
        <button id="account-btn" class="chip chip-btn"></button>
      </div>

      <header class="landing-head">
        <h1 class="logo">Cozy<span>Tally</span> <span class="logo-moon">🌙</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </header>

      <div class="landing-panels">
        <section class="panel">
          <h2 data-i18n="createTitle"></h2>
          <form id="create-form">
            <input id="create-name" type="text" maxlength="40" autocomplete="off" data-i18n-ph="createPlaceholder">
            <button type="submit" class="btn btn-primary" data-i18n="createBtn"></button>
          </form>
        </section>

        <section class="panel">
          <h2 data-i18n="joinTitle"></h2>
          <form id="join-form">
            <input id="join-code" type="text" maxlength="40" autocomplete="off" spellcheck="false" data-i18n-ph="joinPlaceholder">
            <button type="submit" class="btn btn-secondary" data-i18n="joinBtn"></button>
          </form>
          <p id="join-error" class="join-error" hidden data-i18n="roomNotFound"></p>
        </section>
      </div>

      <section id="recent-rooms" class="recent" hidden>
        <h3 data-i18n="recentTitle"></h3>
        <div id="recent-list" class="recent-list"></div>
      </section>

      <!-- short intro for first-time visitors -->
      <section class="intro">
        <h2 class="intro-title" data-i18n="introHow"></h2>
        <ol class="steps">
          <li class="step">
            <span class="step-num">1</span>
            <b data-i18n="step1"></b>
            <span data-i18n="step1Desc"></span>
          </li>
          <li class="step">
            <span class="step-num">2</span>
            <b data-i18n="step2"></b>
            <span data-i18n="step2Desc"></span>
          </li>
          <li class="step">
            <span class="step-num">3</span>
            <b data-i18n="step3"></b>
            <span data-i18n="step3Desc"></span>
          </li>
        </ol>

        <h2 class="intro-title" data-i18n="introCards"></h2>
        <div id="intro-cards" class="intro-cards"></div>

        <div id="intro-perks" class="intro-perks"></div>
      </section>

      <p class="landing-footer" data-i18n="landingFooter"></p>
    </div>

    <!-- Boba & Tofu stargazing on the hill -->
    <svg class="stargazers" viewBox="0 0 230 150" aria-hidden="true">
      <ellipse cx="115" cy="152" rx="132" ry="36" fill="#1c163a"/>
      <g class="bob">
        <line x1="181" y1="100" x2="196" y2="42" stroke="#ffd7a8" stroke-width="1.5" opacity="0.7"/>
        <circle cx="196" cy="34" r="14" fill="#ffd7a8" opacity="0.15"/>
        <path d="M196,24 L199.4,31.1 L207.1,32.3 L201.2,37.9 L202.3,45.7 L196,41.5 L189.7,45.7 L190.8,37.9 L184.9,32.3 L192.6,31.1 Z"
          fill="#ffd7a8" stroke="#ffd7a8" stroke-width="3" stroke-linejoin="round"/>
      </g>
      <g class="breathe">
        <ellipse cx="70" cy="112" rx="34" ry="27" fill="#e0a86f"/>
        <ellipse cx="70" cy="119" rx="20" ry="15" fill="#f5cf9e"/>
        <circle cx="52" cy="52" r="9" fill="#e0a86f"/>
        <circle cx="52" cy="52" r="4.5" fill="#f5cf9e"/>
        <circle cx="88" cy="52" r="9" fill="#e0a86f"/>
        <circle cx="88" cy="52" r="4.5" fill="#f5cf9e"/>
        <circle cx="70" cy="72" r="26" fill="#e0a86f"/>
        <ellipse cx="70" cy="81" rx="11" ry="8" fill="#f5cf9e"/>
        <path d="M67,77 q3,-2.5 6,0 q-1.5,3 -3,3 q-1.5,0 -3,-3" fill="#6b4a36"/>
        <path d="M66,84 q4,3 8,0" stroke="#6b4a36" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle class="k-eye" cx="59" cy="66" r="2.8" fill="#3d2b22"/>
        <circle class="k-eye" cx="81" cy="66" r="2.8" fill="#3d2b22"/>
        <ellipse cx="51" cy="76" rx="4" ry="2.4" fill="#ff9eb5" opacity="0.55"/>
        <ellipse cx="89" cy="76" rx="4" ry="2.4" fill="#ff9eb5" opacity="0.55"/>
        <rect x="93" y="97" width="15" height="17" rx="4" fill="#ff9eb5"/>
        <path d="M108,102 q6,2 0,8" fill="none" stroke="#ff9eb5" stroke-width="3"/>
        <path class="steam" d="M100,92 q-3,-6 0,-10" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
        <ellipse cx="48" cy="132" rx="10" ry="6" fill="#d3915b"/>
        <ellipse cx="92" cy="132" rx="10" ry="6" fill="#d3915b"/>
      </g>
      <g class="breathe" style="animation-delay:0.9s">
        <ellipse cx="160" cy="118" rx="26" ry="21" fill="#f6eef7"/>
        <ellipse cx="160" cy="123" rx="14" ry="10" fill="#fffdf6"/>
        <ellipse cx="149" cy="58" rx="6.5" ry="19" fill="#f6eef7" transform="rotate(-8 149 58)"/>
        <ellipse cx="149" cy="60" rx="3" ry="13" fill="#ffb6c9" transform="rotate(-8 149 60)"/>
        <ellipse cx="172" cy="60" rx="6.5" ry="18" fill="#f6eef7" transform="rotate(22 172 60)"/>
        <ellipse cx="172" cy="62" rx="3" ry="12" fill="#ffb6c9" transform="rotate(22 172 62)"/>
        <circle cx="160" cy="86" r="20" fill="#f6eef7"/>
        <circle class="k-eye" cx="152" cy="83" r="2.5" fill="#4a3d5c"/>
        <circle class="k-eye" cx="168" cy="83" r="2.5" fill="#4a3d5c"/>
        <path d="M158,88 L162,88 L160,90.5 Z" fill="#ff9eb5"/>
        <path d="M157,93 q3,2.5 6,0" stroke="#4a3d5c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <ellipse cx="146" cy="92" rx="3.5" ry="2.2" fill="#ff9eb5" opacity="0.55"/>
        <ellipse cx="174" cy="92" rx="3.5" ry="2.2" fill="#ff9eb5" opacity="0.55"/>
        <ellipse cx="180" cy="103" rx="5" ry="7" fill="#f6eef7" transform="rotate(-30 180 103)"/>
        <ellipse cx="144" cy="136" rx="9" ry="5.5" fill="#efe2f0"/>
        <ellipse cx="176" cy="136" rx="9" ry="5.5" fill="#efe2f0"/>
      </g>
      <circle cx="118" cy="124" r="7" fill="#ffb86b" opacity="0.9"/>
      <circle cx="118" cy="124" r="13" fill="#ffb86b" opacity="0.2"/>
      <rect x="115" y="130" width="6" height="7" rx="2" fill="#8a6b4a"/>
    </svg>
  </main>

  <!-- ===================== room ===================== -->
  <main id="view-room" class="view" hidden>
    <header id="room-header">
      <div class="room-title-wrap">
        <h1 id="room-name"></h1>
        <button id="rename-btn" class="icon-btn" title="✏️">✏️</button>
      </div>
      <div class="room-tools">
        <button id="copy-link" class="chip chip-btn"><span class="chip-code"></span> 🔗</button>
        <button id="notif-btn" class="chip chip-btn" hidden>🔕</button>
        <button id="feel-btn" class="chip chip-btn">🔊</button>
        <button id="music-btn" class="chip chip-btn">🎵</button>
        <div id="members" class="members"></div>
      </div>
    </header>

    <div id="board" class="board"></div>
    <div id="empty-hint" class="empty-hint" hidden>
      <svg class="star-buddy" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="58" r="46" fill="#ffd7a8" opacity="0.1"/>
        <path d="M60,20 L69.4,45.1 L96.1,46.3 L75.2,62.9 L82.3,88.7 L60,74 L37.7,88.7 L44.8,62.9 L23.9,46.3 L50.6,45.1 Z"
          fill="#ffd7a8" stroke="#ffd7a8" stroke-width="7" stroke-linejoin="round"/>
        <circle class="k-eye" cx="52" cy="55" r="2.8" fill="#6b4a36"/>
        <circle class="k-eye" cx="68" cy="55" r="2.8" fill="#6b4a36"/>
        <path d="M54,62 q6,5 12,0" stroke="#6b4a36" stroke-width="2" fill="none" stroke-linecap="round"/>
        <ellipse cx="45" cy="61" rx="3.5" ry="2.2" fill="#ff9eb5" opacity="0.6"/>
        <ellipse cx="75" cy="61" rx="3.5" ry="2.2" fill="#ff9eb5" opacity="0.6"/>
      </svg>
      <p data-i18n="emptyBoard"></p>
      <button id="replay-tour" class="chip chip-btn" data-i18n="howItWorks"></button>
    </div>

    <div class="dock-veil" aria-hidden="true"></div>
    <!-- what to make rain; opened by the 💖 button, filled in by app.js -->
    <div id="rain-picker" class="rain-pick" hidden></div>
    <nav class="dock" aria-label="CozyTally">
      <button id="fab-chat" class="fab fab-chat" title="💬">💬<span id="chat-badge" class="chat-badge" hidden></span></button>
      <button id="fab-love" class="fab fab-love" title="💖">💖</button>
      <button id="fab-add" class="fab" title="+">+</button>
    </nav>
  </main>

  <!-- chat drawer — kept outside the room view so it stacks above the
       fixed page chrome instead of being trapped in the view's layer -->
  <div id="chat-scrim" class="chat-scrim"></div>
  <aside id="chat-drawer" class="chat-drawer">
    <header class="chat-head">
      <h3 data-i18n="chatTitle"></h3>
      <button id="chat-close" class="chat-close-btn" aria-label="✕">✕</button>
    </header>
    <div id="chat-list" class="chat-list"></div>
    <form id="chat-form" class="chat-form">
      <button type="button" id="chat-photo" class="icon-btn chat-photo-btn" title="📷">📷</button>
      <input type="file" id="chat-file" accept="image/*" hidden>
      <input type="text" id="chat-input" maxlength="500" autocomplete="off" data-i18n-ph="chatPlaceholder">
      <button type="submit" class="chat-send">➤</button>
    </form>
  </aside>

  <!-- language toggle (both views) -->
  <button id="lang-toggle" class="chip chip-btn lang-toggle"></button>

  <!-- ===================== modals ===================== -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <canvas id="confetti-canvas"></canvas>

  <!-- The game rules, the same module the server referees with. The reversi
       board and the word chain ask it what is legal as they draw, so it has
       to be here by the first render, not only when the demo opens. -->
  <script type="module">
    import * as games from '/games.js?v=dev';
    import * as pet from '/pet.js?v=dev';
    window.CTGames = games;
    window.CTPet = pet;
  </script>
  <script src="/i18n.js?v=dev"></script>
  <script src="/app.js?v=dev"></script>
</body>
</html>
